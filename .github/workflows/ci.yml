name: CI

on:
  push:
    branches: ["main", "development", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "development"]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    name: Quality workflow
    needs: project-dependency-images
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the dependency image security gate
        if: needs.project-dependency-images.result != 'success' && needs.project-dependency-images.result != 'skipped'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check scripts/check-oauth-provider.mjs
      - run: node --check scripts/check-public-mcp.mjs
      - run: node --check scripts/check-branch-policy.mjs
      - run: npm run check:branch-policy
      - run: node --check scripts/rootless-runtime-preflight.mjs
      - run: node --check scripts/vps-sandboxctl.mjs
      - run: node --check scripts/vps-sandboxctl-broker.mjs
      - run: node --check scripts/rootless-runtime-acceptance.mjs
      - run: node --check scripts/recover-project-services.mjs
      - run: node --check scripts/vps-sandbox-runtime.mjs
      - run: node --check scripts/vps-sandbox-quota-helper.mjs
      - run: node --check scripts/vps-sandbox-quota-broker.mjs
      - run: node --check scripts/project-pod.mjs
      - run: node --check scripts/project-dependency.mjs
      - run: node --check scripts/project-backup.mjs
      - run: bash -n scripts/deploy-gateway.sh
      - run: bash -n scripts/deploy-development-gateway.sh
      - run: bash -n scripts/provision-development-runtime.sh
      - run: bash -n scripts/configure-development-runtime-access.sh
      - run: bash -n scripts/configure-development-project-environment-root.sh
      - run: bash -n scripts/install-vps-sandbox-runtime.sh
      - run: node --check scripts/project-environment-root-config.mjs
      - run: bash -n scripts/provision-development-deploy-access.sh
      - run: node --check scripts/deploy-development.mjs
      - run: bash -n scripts/provision-production-deploy-access.sh
      - run: bash -n scripts/provision-rootless-podman.sh
      - run: bash -n scripts/install-vps-sandboxctl.sh
      - run: bash -n runtime/laravel-php/smoke-test.sh
      - run: bash -n scripts/project-dependency-smoke-test.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish required quality commit status
        if: always()
        uses: actions/github-script@v7
        env:
          QUALITY_RESULT: ${{ job.status }}
          QUALITY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const result = process.env.QUALITY_RESULT;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.QUALITY_SHA,
              state,
              context: 'quality',
              description: `Quality job ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  laravel-runtime-image:
    name: Build, smoke-test and scan Laravel runtime image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Laravel runtime image
        run: docker build --pull -f runtime/laravel-php/Dockerfile -t vps-mcp/laravel-php:ci .
      - name: Verify runtime contract under container restrictions
        run: runtime/laravel-php/smoke-test.sh vps-mcp/laravel-php:ci
      - name: Scan runtime image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vps-mcp/laravel-php:ci
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  project-dependency-images:
    name: Verify and scan pinned MySQL and Redis dependency images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate DHI registry credentials
        env:
          DHI_REGISTRY_USERNAME: ${{ secrets.DHI_REGISTRY_USERNAME }}
          DHI_REGISTRY_PASSWORD: ${{ secrets.DHI_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DHI_REGISTRY_USERNAME:?Set DHI_REGISTRY_USERNAME in repository Actions secrets}"
          : "${DHI_REGISTRY_PASSWORD:?Set DHI_REGISTRY_PASSWORD in repository Actions secrets}"
      - name: Authenticate to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_REGISTRY_USERNAME }}
          password: ${{ secrets.DHI_REGISTRY_PASSWORD }}
      - name: Pull exact approved dependency digests
        run: |
          set -euo pipefail
          docker pull dhi.io/mysql@sha256:50f6fc4ce3fe8c156e912236124ad0efbcfcb02e910158acf6fea3ec18d131f1
          docker pull dhi.io/redis@sha256:0c2f0621ffd277410b03ac735a0f6d33887c925eae8665133d47836ff98f1eae
      - name: Scan MySQL 8.4.13 for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dhi.io/mysql@sha256:50f6fc4ce3fe8c156e912236124ad0efbcfcb02e910158acf6fea3ec18d131f1
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Redis 8.10.3 for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dhi.io/redis@sha256:0c2f0621ffd277410b03ac735a0f6d33887c925eae8665133d47836ff98f1eae
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke-test DHI entrypoints, credentials and read-only runtime contracts
        run: scripts/project-dependency-smoke-test.sh \
          dhi.io/mysql@sha256:50f6fc4ce3fe8c156e912236124ad0efbcfcb02e910158acf6fea3ec18d131f1 \
          dhi.io/redis@sha256:0c2f0621ffd277410b03ac735a0f6d33887c925eae8665133d47836ff98f1eae

  publish-laravel-runtime-image:
    name: Publish immutable Laravel runtime image
    needs: [quality, laravel-runtime-image, project-dependency-images]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'publish-runtime-image'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/laravel-php/Dockerfile
          push: true
          tags: ghcr.io/deputy-proxy/vps-mcp-laravel-php:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.sha) || format('development-{0}', github.sha) }}
          labels: |
            org.opencontainers.image.source=https://github.com/deputy-proxy/vps-mcp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CR8OR Laravel PHP runtime
          sbom: true
          provenance: mode=max
      - name: Smoke-test the exact published image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/deputy-proxy/vps-mcp-laravel-php@$IMAGE_DIGEST"
          docker pull "$IMAGE"
          runtime/laravel-php/smoke-test.sh "$IMAGE"
      - name: Scan the exact published image digest
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          image-ref: ghcr.io/deputy-proxy/vps-mcp-laravel-php@${{ steps.build.outputs.digest }}
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/deputy-proxy/vps-mcp-laravel-php@$IMAGE_DIGEST"
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/laravel-runtime-image.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: laravel-runtime-image-digest
          path: ${{ runner.temp }}/laravel-runtime-image.txt
          if-no-files-found: error

  deploy-production:
    name: Deploy production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: vps-mcp-production-deploy
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          VPS_PRODUCTION_HOST: ${{ vars.VPS_PRODUCTION_HOST }}
          VPS_PRODUCTION_PORT: ${{ vars.VPS_PRODUCTION_PORT || '22' }}
          VPS_PRODUCTION_DEPLOY_KEY: ${{ secrets.VPS_PRODUCTION_DEPLOY_KEY }}
          VPS_PRODUCTION_KNOWN_HOSTS: ${{ secrets.VPS_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_PRODUCTION_HOST:?Set VPS_PRODUCTION_HOST in the production environment}"
          : "${VPS_PRODUCTION_DEPLOY_KEY:?Set VPS_PRODUCTION_DEPLOY_KEY in the production environment}"
          : "${VPS_PRODUCTION_KNOWN_HOSTS:?Set VPS_PRODUCTION_KNOWN_HOSTS in the production environment}"
          [[ "$VPS_PRODUCTION_PORT" =~ ^[0-9]+$ ]]
          (( VPS_PRODUCTION_PORT >= 1 && VPS_PRODUCTION_PORT <= 65535 ))
          printf '%s\n' "$VPS_PRODUCTION_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_PRODUCTION_DEPLOY_KEY" > "$RUNNER_TEMP/vps-deploy-key"
          chmod 600 "$RUNNER_TEMP/vps-known-hosts" "$RUNNER_TEMP/vps-deploy-key"
          ssh-keygen -y -f "$RUNNER_TEMP/vps-deploy-key" > /dev/null
      - name: Deploy the exact main commit
        env:
          VPS_PRODUCTION_HOST: ${{ vars.VPS_PRODUCTION_HOST }}
          VPS_PRODUCTION_PORT: ${{ vars.VPS_PRODUCTION_PORT || '22' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh \
            -p "$VPS_PRODUCTION_PORT" \
            -i "$RUNNER_TEMP/vps-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-known-hosts" \
            -o ConnectTimeout=10 \
            "vps-mcp-deploy@${VPS_PRODUCTION_HOST}" \
            "deploy ${DEPLOY_SHA}"

  deploy-development:
    name: Deploy development
    needs: [quality, laravel-runtime-image, publish-laravel-runtime-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: vps-mcp-development-deploy
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          VPS_DEVELOPMENT_HOST: ${{ vars.VPS_DEVELOPMENT_HOST }}
          VPS_DEVELOPMENT_PORT: ${{ vars.VPS_DEVELOPMENT_PORT || '22' }}
          VPS_DEVELOPMENT_DEPLOY_KEY: ${{ secrets.VPS_DEVELOPMENT_DEPLOY_KEY }}
          VPS_DEVELOPMENT_KNOWN_HOSTS: ${{ secrets.VPS_DEVELOPMENT_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_DEVELOPMENT_HOST:?Set VPS_DEVELOPMENT_HOST in the development environment}"
          : "${VPS_DEVELOPMENT_DEPLOY_KEY:?Set VPS_DEVELOPMENT_DEPLOY_KEY in the development environment}"
          : "${VPS_DEVELOPMENT_KNOWN_HOSTS:?Set VPS_DEVELOPMENT_KNOWN_HOSTS in the development environment}"
          [[ "$VPS_DEVELOPMENT_PORT" =~ ^[0-9]+$ ]]
          (( VPS_DEVELOPMENT_PORT >= 1 && VPS_DEVELOPMENT_PORT <= 65535 ))
          printf '%s\n' "$VPS_DEVELOPMENT_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_DEVELOPMENT_DEPLOY_KEY" > "$RUNNER_TEMP/vps-deploy-key"
          chmod 600 "$RUNNER_TEMP/vps-known-hosts" "$RUNNER_TEMP/vps-deploy-key"
          ssh-keygen -y -f "$RUNNER_TEMP/vps-deploy-key" > /dev/null
      - name: Deploy the exact development commit
        env:
          VPS_DEVELOPMENT_HOST: ${{ vars.VPS_DEVELOPMENT_HOST }}
          VPS_DEVELOPMENT_PORT: ${{ vars.VPS_DEVELOPMENT_PORT || '22' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh \
            -p "$VPS_DEVELOPMENT_PORT" \
            -i "$RUNNER_TEMP/vps-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-known-hosts" \
            -o ConnectTimeout=10 \
            "vps-mcp-development-deploy@${VPS_DEVELOPMENT_HOST}" \
            "deploy-development ${DEPLOY_SHA}"
