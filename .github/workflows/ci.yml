name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check scripts/check-oauth-provider.mjs
      - run: node --check scripts/check-public-mcp.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
