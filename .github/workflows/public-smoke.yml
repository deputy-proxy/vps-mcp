name: Public MCP smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the live public MCP endpoint from GitHub-hosted infrastructure
        env:
          MCP_URL: ${{ vars.MCP_PUBLIC_URL || 'https://sndbx.cr8or.be/mcp' }}
        run: node scripts/check-public-mcp.mjs
