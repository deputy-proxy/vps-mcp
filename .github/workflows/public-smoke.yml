name: Public MCP smoke test

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/public-smoke.yml"
      - "scripts/check-public-mcp.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the live public MCP endpoint from GitHub-hosted infrastructure
        env:
          MCP_URL: ${{ vars.MCP_PUBLIC_URL || 'https://194.163.133.147/mcp' }}
        run: node scripts/check-public-mcp.mjs
